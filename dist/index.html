<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yu Wang</title>
  <meta name="description" content="Yu Wang, documentary filmmaker and photographer.">
  <meta name="theme-color" content="#141414">
  <link rel="preload" href="fonts/karla-300.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <button class="skip" type="button">Skip to content</button>

  <header class="site-header">
    <nav class="nav" aria-label="Main">
      <a href="#/" data-tab="home"><span class="nm" data-name>Yu Wang</span></a>
      <a href="#/video" data-tab="video">Video</a>
      <a href="#/photo" data-tab="photo">Photo</a>
      <a href="#/about" data-tab="about">About</a>
    </nav>
    <div class="mbar">
      <a class="mbar-name" href="#/" data-name>Yu Wang</a>
      <button class="icon-btn menu-open" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mmenu">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><path d="M3 8h18M3 16h18"/></svg>
      </button>
    </div>
  </header>

  <div class="mmenu" id="mmenu" hidden>
    <div class="mbar">
      <a class="mbar-name" href="#/" data-name>Yu Wang</a>
      <button class="icon-btn menu-close" type="button" aria-label="Close menu">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>
    <nav class="mnav" aria-label="Main">
      <a class="mrow" href="#/" data-tab="home">Reels</a>
      <a class="mrow" href="#/video" data-tab="video">Video</a>
      <a class="mrow" href="#/photo" data-tab="photo">Photo</a>
      <a class="mrow" href="#/about" data-tab="about">About</a>
    </nav>
  </div>

  <main id="view" tabindex="-1"></main>

  <footer class="site-footer">© <span data-year></span> <span data-name>Yu Wang</span></footer>

  <div class="overlay player" id="player" role="dialog" aria-modal="true" aria-label="Video player" hidden>
    <p class="ov-title"></p>
    <div class="player-frame"></div>
    <button class="icon-btn ov-close" type="button" aria-label="Close player">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
  </div>

  <div class="overlay lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <img class="lb-img" alt="">
    <button class="arrow lb-prev" type="button" aria-label="Previous photo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><path d="M15 4l-8 8 8 8"/></svg>
    </button>
    <button class="arrow lb-next" type="button" aria-label="Next photo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><path d="M9 4l8 8-8 8"/></svg>
    </button>
    <button class="icon-btn ov-close" type="button" aria-label="Close viewer">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
    <p class="meta lb-count" aria-live="polite"></p>
  </div>
</body>
</html>
